version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/security"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: bun
    directories: ["/.agents/skills/*/cli"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cli-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
