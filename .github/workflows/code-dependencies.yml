name: Code and dependency security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Source and dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Install hash-verified security tools
        # Install the complete resolved closure; Semgrep's telemetry pins are
        # deliberately overridden and checked by the following steps.
        run: python -m pip install --require-hashes --no-deps -r security/requirements.txt
      - name: Check dependency lock consistency
        run: python scripts/security/check_dependency_locks.py
      - name: Verify patched telemetry and tool compatibility
        run: python scripts/security/check_telemetry.py
      - name: Test dependency snapshot validation
        run: python -m unittest discover -s tests/security -p test_dependency_snapshot.py
      - name: Verify vulnerable-code and dependency rejection
        run: python scripts/security/check_code_dependencies.py canaries
      - name: Scan tracked application and CLI source
        run: python scripts/security/check_code_dependencies.py static
      - name: Audit Python and every CLI dependency graph
        run: python scripts/security/check_code_dependencies.py dependencies
      - name: Test exception boundaries and upgraded CLI compatibility
        run: |
          python -m venv "$RUNNER_TEMP/app-tests"
          "$RUNNER_TEMP/app-tests/bin/pip" install --require-hashes -r requirements-lock.txt
          "$RUNNER_TEMP/app-tests/bin/python" -m pytest tests/security/test_dependency_exceptions.py -q
          for cli in jobbank-search jobdanmark-search jobindex-search jobnet-search; do
            (cd ".agents/skills/$cli/cli" && bun run src/cli.ts --help > /dev/null)
          done
          bun test ./.agents/skills/jobnet-search/cli/tests/jobnet-adapter.test.ts
