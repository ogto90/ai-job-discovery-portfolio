name: Refresh dashboard summaries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep summary work independent from discovery. Revision guards reject
  # writes built across source updates, and later schedules resume the backlog.
  group: dashboard-summary-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.DASHBOARD_SUMMARY_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: "Job search"
    timeout-minutes: 25
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dashboard builder dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Build the next bounded summary batches
        env:
          DASHBOARD_SUMMARY_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AI_JOB_SEARCH_USER_ID: ${{ secrets.AI_JOB_SEARCH_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "$DASHBOARD_SUMMARY_SUPABASE_SECRET_KEY" || { echo "Missing SUPABASE_SECRET_KEY secret"; exit 1; }
          test -n "$AI_JOB_SEARCH_USER_ID" || { echo "Missing AI_JOB_SEARCH_USER_ID secret"; exit 1; }
          python scripts/build_dashboard_summaries.py \
            --supabase-url "$SUPABASE_URL" \
            --expected-project-ref "${{ vars.SUPABASE_PROJECT_REF }}" \
            --user-id "$AI_JOB_SEARCH_USER_ID" \
            --max-batches 20 \
            --retries 3 \
            --allow-production
