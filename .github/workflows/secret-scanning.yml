name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks and detection checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out history without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned scanner and verify checksum
        run: bash scripts/security/install_gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Verify detection and redaction using synthetic data
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: python3 -m unittest discover -s tests -p test_secret_scanning.py -v

      - name: Scan all fetched Git history
        run: python3 scripts/security/scan_secrets.py history --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"

      - name: Scan current tracked and nonignored files
        if: success() || failure()
        run: python3 scripts/security/scan_secrets.py worktree --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
