name: Scheduled job discovery

on:
  workflow_dispatch:
    inputs:
      enable_candidate_tracing:
        description: "Enable candidate-level discovery tracing for this manual run only."
        required: false
        type: boolean
        default: false
      enable_jd_enrichment_60_pilot:
        description: "Use up to 60 JD enrichment attempts for this manual discovery run only."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    environment: "Job search"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies for discovery and bounded summaries
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Validate required settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AI_JOB_SEARCH_USER_ID: ${{ secrets.AI_JOB_SEARCH_USER_ID }}
          AI_JOB_SEARCH_ATS_REGISTRY_SOURCE: supabase
          AI_JOB_SEARCH_ATS_REGISTRY_MIN_VERIFIED: "1"
          # GITHUB_RUN_NUMBER is stable on retries and advances for each run.
          AI_JOB_SEARCH_ATS_ROTATION_SLOT: "${{ github.run_number }}"
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "Missing SUPABASE_SECRET_KEY secret"; exit 1; }
          test -n "$AI_JOB_SEARCH_USER_ID" || { echo "Missing AI_JOB_SEARCH_USER_ID secret"; exit 1; }
          test "$AI_JOB_SEARCH_ATS_REGISTRY_SOURCE" = "supabase" || { echo "Scheduled discovery must use the durable ATS board registry"; exit 1; }
          [[ "$AI_JOB_SEARCH_ATS_ROTATION_SLOT" =~ ^[0-9]+$ ]] || { echo "Missing or invalid ATS rotation slot"; exit 1; }

      - name: Install dependencies for scraper CLIs with runtime packages
        run: |
          set -euo pipefail
          for cli in jobbank-search jobdanmark-search jobindex-search jobnet-search; do
            bun install --cwd ".agents/skills/${cli}/cli" --frozen-lockfile
          done

      - name: Run broad discovery
        id: discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AI_JOB_SEARCH_USER_ID: ${{ secrets.AI_JOB_SEARCH_USER_ID }}
          AI_JOB_SEARCH_ATS_REGISTRY_SOURCE: supabase
          AI_JOB_SEARCH_ATS_REGISTRY_MIN_VERIFIED: "1"
          AI_JOB_SEARCH_ATS_ROTATION_SLOT: "${{ github.run_number }}"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY_AT: ${{ secrets.JOOBLE_API_KEY_AT }}
          JOOBLE_API_KEY_DE: ${{ secrets.JOOBLE_API_KEY_DE }}
          JOOBLE_API_KEY_UK: ${{ secrets.JOOBLE_API_KEY_UK }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          JOOBLE_MARKETS: at,de,uk
          AI_JOB_SEARCH_TRACING_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_candidate_tracing == true }}
          AI_JOB_SEARCH_TRACE_MAX_CANDIDATES: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_candidate_tracing == true && '500' || '5000' }}
          AI_JOB_SEARCH_JD_ENRICHMENT_MAX_ATTEMPTS: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_jd_enrichment_60_pilot == true && '60' || '30' }}
        run: |
          echo "JD enrichment budget: $AI_JOB_SEARCH_JD_ENRICHMENT_MAX_ATTEMPTS adapter attempts."
          if [[ "$AI_JOB_SEARCH_TRACING_ENABLED" == "true" ]]; then
            echo "Candidate-level tracing enabled for this manual run (diagnostic cap: 500)."
          else
            echo "Candidate-level tracing disabled for this run."
          fi
          python scripts/run_dashboard_discovery.py \
            --status-file "$RUNNER_TEMP/discovery-status.json" \
            --log-file "$RUNNER_TEMP/discovery.log" \
            --user-id "$AI_JOB_SEARCH_USER_ID"

      - name: Build summaries for this discovery run
        if: steps.discovery.outcome == 'success'
        continue-on-error: true
        env:
          DASHBOARD_SUMMARY_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AI_JOB_SEARCH_USER_ID: ${{ secrets.AI_JOB_SEARCH_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          python scripts/build_dashboard_summaries.py \
            --supabase-url "$SUPABASE_URL" \
            --expected-project-ref "${{ vars.SUPABASE_PROJECT_REF }}" \
            --user-id "$AI_JOB_SEARCH_USER_ID" \
            --discovery-status-file "$RUNNER_TEMP/discovery-status.json" \
            --max-batches 20 \
            --retries 3 \
            --allow-production \
            --require-complete

      - name: Summarize run
        if: always()
        env:
          STATUS_FILE: ${{ runner.temp }}/discovery-status.json
          LOG_FILE: ${{ runner.temp }}/discovery.log
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status_path = Path(os.environ["STATUS_FILE"])
          log_path = Path(os.environ["LOG_FILE"])
          if not status_path.exists():
              print("Discovery did not produce a status file; check the setup and runner logs above.")
              raise SystemExit(0)

          status = json.loads(status_path.read_text(encoding="utf-8"))
          print(f"Discovery status: {status.get('status', 'unknown')}")
          result = status.get("result") or {}
          for run in result.get("runs", []):
              stats = run.get("stats") or {}
              print(
                  f"{run.get('mode', 'run')}: {stats.get('new_jobs', 0)} new, "
                  f"{stats.get('existing_jobs', 0)} updated, "
                  f"{stats.get('final_actionable', 0)} actionable, "
                  f"{stats.get('fit_ready', 0)} full JDs ready to rate"
              )
              print(
                  f"ATS boards: {stats.get('ats_boards_crawled', 0)} selected, "
                  f"{stats.get('ats_boards_deferred_budget', 0)} deferred by budget, "
                  f"rotation slot {stats.get('ats_rotation_slot', 'n/a')}"
              )
              hydration = stats.get("jd_hydration") or {}
              print(
                  f"JD enrichment: budget={hydration.get('budget', 'n/a')}, "
                  f"attempts={hydration.get('attempted', 0)}, "
                  f"full={hydration.get('fullAfterEnrichment', 0)}, "
                  f"deferred={hydration.get('deferred', 0)}"
              )
              for board in stats.get("ats_selected_boards", []):
                  print(f"ATS board selected: {board}")
              for issue in stats.get("errors", []):
                  print(f"Issue ({issue.get('source', 'source')}): {issue.get('message', 'details unavailable')}")
              traces = stats.get("candidate_traces") or {}
              if traces.get("enabled"):
                  write = traces.get("write") or {}
                  print(
                      "Candidate traces: "
                      f"selected={write.get('selected_for_persistence', 0)}, "
                      f"persisted={write.get('records_persisted', traces.get('persisted', 0))}, "
                      f"failed_write={write.get('records_failed_write', 0)}, "
                      f"outcome_unknown={write.get('records_outcome_unknown', 0)}, "
                      f"not_attempted={write.get('records_not_attempted', 0)}, "
                      f"skipped_after_failure={write.get('records_skipped_after_failure', 0)}, "
                      f"skipped_due_budget={write.get('records_skipped_due_budget', 0)}, "
                      f"omitted_by_cap={traces.get('omitted_by_cap', 0)}"
                  )
                  print(
                      "Candidate trace writes: "
                      f"batches_prepared={write.get('batches_prepared', 0)}, "
                      f"attempted={write.get('batches_attempted', 0)}, "
                      f"succeeded={write.get('batches_succeeded', 0)}, "
                      f"failed={write.get('batches_failed', 0)}, "
                      f"not_attempted={write.get('batches_not_attempted', 0)}, "
                      f"duration_ms={write.get('write_duration_ms', 0)}, "
                      f"budget_exhausted={write.get('write_budget_exhausted', False)}, "
                      f"failure_kind={write.get('write_failure_kind') or 'none'}, "
                      f"http_status={write.get('write_http_status', 'n/a')}, "
                      f"error_code={write.get('write_error_code', 'n/a')}"
                  )

          if status.get("status") == "failed":
              print(status.get("error") or "Discovery failed; see the runner logs.")
              if log_path.exists():
                  for line in log_path.read_text(encoding="utf-8", errors="replace").splitlines():
                      if line.startswith("Discovery persistence failed during "):
                          print(line[:400])
          PY
